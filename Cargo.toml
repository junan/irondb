[package]
name = "irondb"
version = "0.1.0"
edition = "2021"
description = "Redis-inspired in-memory database server in Rust."

[dependencies]
tokio = { version = "1.42", features = ["full"] }
clap = { version = "=4.5.20", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[lib]
name = "irondb"
path = "src/lib.rs"

[[bin]]
name = "irondb"
path = "src/main.rs"
